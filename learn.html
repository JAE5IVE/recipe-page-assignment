<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>learn</title>
    <style>
      body {
        background-image: url(assets/images/IMG\ 4.jpg);
        background-repeat: no-repeat;
        background-size: 1370px;
        font-family: Arial, Helvetica, sans-serif;
      }
      #heading {
        font-family: Arial, Helvetica, sans-serif;
      }
      .profilepic {
        width: 150px;
        height: 200px;
        padding-left: 10px;
        padding-top: 5px;
        padding-right: 10px;
      }
      .profile {
        background-color: rgb(221, 221, 221);
        margin-left: 10px;
        display: inline-block;
        border-radius: 10px;
        padding-bottom: 10px;
      }
      .writing {
        padding-left: 10px;
      }
      button {
        font-size: 20px;
        border-radius: 3px;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 10px;
        padding-right: 10px;
        background-color: rgb(87, 87, 172);
        color: white;
        cursor: pointer;
        transition: 0.5s;
        box-shadow: inset;
        border-style: inherit;
      }
        button:hover {
            opacity: 0.5;
            color: rgb(87, 87, 172);
            background-color: white;
        }
      
        button:active {
          color: black;
          
        }
        
    </style>
  </head>
  <header id="heading">
    <h1>Welcome to my Landing Page</h1>
  </header>
  <body>
    <section>
      <div class="profile">
        <img
          class="profilepic"
          src="assets/images/Gc2ArOEW0AApy0B.jpeg"
          alt="imagery"
        />
        <div class="writing">
          <p>Kingsley Stevens</p>
          <p>Arlington, TX</p>
          <p>3+ Mutual Friends</p>
          <button class="add button">add friend</button>
        </div>
      </div>

      <div class="profile">
        <img
          class="profilepic"
          src="assets/images/Gc8wIfMWEAAIu44.jpeg"
          alt="imagery"
        />
        <div class="writing">
          <p>Wesley Hunter</p>
          <p>Boston, MA</p>
          <p>10+ Mutual Friends</p>
          <button class="add button">add friend</button>
        </div>
      </div>
    </section>
  </body>
</html>
