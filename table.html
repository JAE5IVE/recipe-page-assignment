<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 200px;
            column-gap: 20px;
            row-gap: 20px;
            
        }
        div {
            background-color: firebrick;
        }
    </style>
</head>
<body>
    <section class="grid">
<div>one</div>
<div>two</div>
<div>three</div>
<div>four</div>
    </section>
    <section>
        
    </section>
</body>
</html>
